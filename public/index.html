<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Grid Duel Lab · Tic-Tac-Toe 3×3–6×6</title>
  <meta
    name="description"
    content="Play Tic-Tac-Toe on 3×3 to 6×6 boards against the classic computer or watch computer vs computer."
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Tic-Tac-Toe 3×3–6×6</p>
        <h1>Grid Duel Lab</h1>
      </div>
      <p class="subtitle">Play the classic computer, or let two computers battle.</p>
    </header>

    <section class="panel setup" aria-label="Game setup">
      <label>
        <span>Board</span>
        <select id="board-size">
          <option value="3">3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5">5 × 5</option>
          <option value="6">6 × 6</option>
        </select>
      </label>

      <label>
        <span>Mode</span>
        <select id="mode">
          <option value="human-vs-cpu">You vs computer</option>
          <option value="cpu-vs-cpu">Computer vs computer</option>
        </select>
      </label>

      <label id="human-mark-wrap">
        <span>You play</span>
        <select id="human-mark">
          <option value="X">X · first</option>
          <option value="O">O · second</option>
        </select>
      </label>

      <label id="speed-wrap" hidden>
        <span>Speed</span>
        <select id="speed">
          <option value="700">Slow</option>
          <option value="350" selected>Normal</option>
          <option value="100">Fast</option>
        </select>
      </label>
    </section>

    <section class="game-card">
      <div class="game-topbar">
        <p id="status" class="status" aria-live="polite">X · You to move</p>
        <div class="actions">
          <button id="pause" class="button button--quiet" type="button" hidden>Pause</button>
          <button id="new-game" class="button" type="button">New game</button>
        </div>
      </div>

      <div id="board" class="board" aria-label="Tic-Tac-Toe board"></div>

      <div class="score" aria-label="Session score">
        <div><span>X</span><strong id="score-x">0</strong></div>
        <div><span>Draws</span><strong id="score-draw">0</strong></div>
        <div><span>O</span><strong id="score-o">0</strong></div>
      </div>
    </section>

    <p class="rules">Fill an entire row, column, or diagonal to win.</p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
